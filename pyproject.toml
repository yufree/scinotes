[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scinotes"
version = "0.1.0"
description = "Your Obsidian-native research assistant — chat through Telegram/QQ/CLI, backed by markdown, augmented by LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "scinotes contributors" }]
keywords = [
    "research",
    "assistant",
    "wiki",
    "markdown",
    "obsidian",
    "telegram-bot",
    "mcp",
    "llm",
    "ollama",
    "claude",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "python-telegram-bot>=22.0",
    "yt-dlp>=2024.1.0",
]

[project.optional-dependencies]
qq = ["qq-botpy>=1.2.0"]
ocr = [
    # Local OCR fallback for scanned/image PDFs.
    # Also requires system binaries: tesseract (+ language packs) and poppler. See SETUP.md.
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/scinotes/scinotes"
Repository = "https://github.com/scinotes/scinotes"
Issues = "https://github.com/scinotes/scinotes/issues"

[project.scripts]
scinotes = "scinotes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scinotes"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "README.zh-CN.md", "LICENSE", "pyproject.toml", "examples/"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
